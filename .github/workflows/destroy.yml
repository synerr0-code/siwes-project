name: Destroy Infrastructure

on:
  workflow_dispatch: # This enables the manual trigger button in GitHub

env:
  AWS_REGION: us-east-1

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup HashiCorp Tools
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init

      - name: Destroy All Resources
        run: |
          echo "Permanently destroying all AWS resources tracked in the state file..."
          terraform destroy -auto-approve \
            -var="app_ami_id=ami-00000000000000000" \
            -var="target_env=blue"